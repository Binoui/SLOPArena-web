name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test feedback API
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # Pages serves the site under the repository path, e.g. /SLOPArena-web/.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_STEAM_URL: ${{ vars.VITE_STEAM_URL }}
          # Pages has no API of its own, so default to the production endpoints.
          VITE_FEEDBACK_API_URL: ${{ vars.VITE_FEEDBACK_API_URL || 'https://sloparena.barakaslurp.fr/api/feedback' }}
          VITE_PRESENCE_URL: ${{ vars.VITE_PRESENCE_URL || 'https://sloparena.barakaslurp.fr/api/presence' }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
