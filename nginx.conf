server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/presence {
    set $presence_upstream sloparena-master-server:8080;
    proxy_pass http://$presence_upstream/internal/presence;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  location /api/feedback {
    proxy_pass http://feedback:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  # Every page is a prebuilt index.html; unknown paths get the 404 page.
  location / {
    try_files $uri $uri/ =404;
  }

  # Astro fingerprints everything it emits here.
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 7d;
  }
}
